name: PREVENIA CI/CD Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  id-token: write   # Required for AWS OIDC authentication
  contents: read

jobs:
  # ==========================================================
  # 1. Backend Verification Job
  # ==========================================================
  backend-ci:
    name: Backend Tests & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Grant Execute Permission to Maven Wrapper
        run: chmod +x ./mvnw

      - name: Execute Backend Tests & Verification
        run: ./mvnw clean verify -B

  # ==========================================================
  # 2. Frontend Verification Job
  # ==========================================================
  frontend-ci:
    name: Frontend Lint, Typecheck & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: ESLint Check
        run: npm run lint

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: Build Next.js Application
        run: npm run build
        env:
          NEXT_PUBLIC_APP_ENV: production
          NEXT_PUBLIC_API_URL: https://api.prevenia.com

  # ==========================================================
  deploy-production:
    name: Deploy to AWS Production
    needs: [ backend-ci, frontend-ci ]
    if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && secrets.AWS_ROLE_TO_ASSUME != ''
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC - No Permanent Keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # --- Build & Push Backend Image ---
      - name: Build & Push Backend Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: prevenia-backend
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest ./backend
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      # --- Build & Push Frontend Image ---
      - name: Build & Push Frontend Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: prevenia-frontend
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_URL=https://api.prevenia.com \
            --build-arg NEXT_PUBLIC_APP_ENV=production \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest ./frontend
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      # --- Deploy to ECS Cluster ---
      - name: Deploy Backend to ECS Fargate
        run: |
          aws ecs update-service \
            --cluster prevenia-prod-cluster \
            --service prevenia-backend-service \
            --force-new-deployment
        continue-on-error: true

      - name: Deploy Frontend to ECS Fargate
        run: |
          aws ecs update-service \
            --cluster prevenia-prod-cluster \
            --service prevenia-frontend-service \
            --force-new-deployment
        continue-on-error: true

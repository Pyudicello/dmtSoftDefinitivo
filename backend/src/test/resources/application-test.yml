spring:
  datasource:
    url: jdbc:h2:mem:prevenia_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false

server:
  port: 0

app:
  info:
    name: PREVENIA
    version: 0.1.0
    status: UP
  cors:
    allowed-origins: http://localhost:3000

spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:file:./target/prevenia_dev;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration,classpath:db/seed/dev

server:
  port: 8080

logging:
  level:
    root: INFO
    com.prevenia: INFO
    org.flywaydb: INFO

management:
  endpoint:
    health:
      show-details: always

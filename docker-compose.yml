name: prevenia

services:
  postgres:
    image: postgres:16-alpine
    container_name: prevenia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-prevenia}
      POSTGRES_USER: ${POSTGRES_USER:-prevenia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prevenia_local_secret}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - prevenia_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-prevenia} -d ${POSTGRES_DB:-prevenia}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - prevenia_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: prevenia-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-prevenia}
      DB_USERNAME: ${POSTGRES_USER:-prevenia}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-prevenia_local_secret}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://frontend:3000}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-1440}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - prevenia_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    container_name: prevenia-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    depends_on:
      backend:
        condition: service_started
    networks:
      - prevenia_network

volumes:
  prevenia_postgres_data:
    name: prevenia_postgres_data

networks:
  prevenia_network:
    name: prevenia_network
    driver: bridge
